# Cleanroom — Netlify deployment configuration
#
# The security headers below are load-bearing product behaviour, not boilerplate.
# `connect-src 'none'` makes it structurally impossible for this page to send a
# network request. That is what allows Cleanroom to claim that a dataset dropped
# into the browser never leaves the device: the claim is enforced by the browser,
# not by our promise. See docs/SECURITY.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-page app fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
